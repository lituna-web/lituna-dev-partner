<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Gateway | Lituna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0A0B;
            --card: #101114;
            --border: #1F2024;
            --grid: #1A1B1F;
            --fg: #E8E8EA;
            --muted: #8A8A92;
            --quiet: #5A5A60;
            --amber: #D97706;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            padding: 32px;
            background:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px),
                var(--bg);
            background-size: 72px 72px;
            background-position: center top;
            color: var(--fg);
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
        }

        ::selection {
            background: var(--amber);
            color: var(--bg);
        }

        .shell {
            width: min(100%, 1120px);
            margin: 0 auto;
        }

        header,
        footer {
            flex: 0 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--fg);
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .mark {
            display: inline-grid;
            grid-template-columns: repeat(2, 10px);
            width: 20px;
            height: 10px;
        }

        .mark::before,
        .mark::after {
            content: "";
            display: block;
            width: 10px;
            height: 10px;
        }
